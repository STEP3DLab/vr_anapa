name: Mobot 1986 v6 verification
on:
  push:
    branches: [main, codex/mobot-1986-v6-20261118]
    paths:
      - 'mobot-ch-hv-1986-research-v6*'
      - 'research/mobot/1986/viewer.*'
      - 'research/mobot/1986/*-qa.*'
      - 'research/mobot/1986/overview.jpg'
      - '.github/workflows/mobot-1986-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Geometry and preserved project contracts
        run: |
          node research/mobot/1986/scene-qa.mjs
          node scripts/mobot-compare-contract.cjs
          node mobot-geometry-gate.cjs
          node scripts/mobot-scene-qa.mjs
      - name: Prepare Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Test v6 in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mobot-v6-http.log 2>&1 &
          node research/mobot/1986/browser-qa.cjs
      - name: Existing browser regressions
        run: |
          node scripts/mobot-browser-qa.cjs
          node scripts/mobot-compare-qa.cjs
      - name: Verify published bytes and production WebGL2
        if: github.ref == 'refs/heads/main'
        env:
          MOBOT_BASE_URL: https://step3dlab.github.io/vr_anapa/
          MOBOT_QA_OUT: v6-production-output
        run: |
          node research/mobot/1986/pages-qa.mjs
          node research/mobot/1986/browser-qa.cjs
      - name: Preserve reports and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobot-1986-v6-evidence
          path: |
            v6-browser-output/
            v6-production-output/
          retention-days: 30
