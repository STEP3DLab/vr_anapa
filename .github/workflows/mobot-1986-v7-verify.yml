name: Mobot 1986 v7 verification
on:
  push:
    branches: [main, 'codex/mobot-1986-v7*']
    paths:
      - 'mobot-ch-hv-1986-research-v7*'
      - 'research/mobot/1986/v7/**'
      - '.github/workflows/mobot-1986-v7-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare archive measurements and nine suspension candidates
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 pillow==11.3.0
          python research/mobot/1986/v7/night-research.py morning v7-engineering-output
      - name: Verify actual geometry and project contracts
        run: |
          node research/mobot/1986/v7/suspension-clearance.mjs > v7-engineering-output/acceptance-clearance.json
          node research/mobot/1986/v7/scene-qa.mjs
          node research/mobot/1986/v7/hanger-cage.mjs > v7-engineering-output/hanger-cage.json
          node scripts/mobot-compare-contract.cjs
          node mobot-geometry-gate.cjs
      - name: Prepare Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p "require('playwright').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Test browser controls, GPU framebuffer and touch viewport
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mobot-v7-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node research/mobot/1986/v7/browser-qa.cjs
      - name: Verify published file hashes and public viewer
        if: github.ref == 'refs/heads/main'
        env:
          MOBOT_BASE_URL: https://step3dlab.github.io/vr_anapa/
          MOBOT_QA_OUT: v7-production-output
        run: |
          node research/mobot/1986/v7/pages-qa.mjs
          node research/mobot/1986/v7/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobot-1986-v7-evidence
          path: |
            v7-browser-output/
            v7-production-output/
            v7-engineering-output/
          retention-days: 60
