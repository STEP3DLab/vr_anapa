name: 1987 v22 viewer acceptance
on:
  push:
    branches: [codex/mobot-1987-v22-night-20261118, main]
    paths:
      - 'mobot-engineering-v22*'
      - 'scripts/mobot-v22-*'
      - 'mobot-geometry-gate.cjs'
      - 'mobot-qa/demo-2026-11-18/sktb-2-landmarks-manual.json'
      - 'research/mobot/1987/night-20261118/**'
      - '.github/workflows/mobot-1987-v22-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUITE: research/mobot/1987/night-20261118
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify provenance and uncertainty of photographed track circles
        run: |
          node scripts/mobot-v22-track-contract.cjs > /tmp/v22-track-ledger.json
          node scripts/mobot-v22-uncertainty.cjs > /tmp/v22-track-uncertainty.json
          mkdir -p /tmp/v22
          node scripts/mobot-v22-perspective-holdout.cjs > /tmp/v22/cross-view-projectivity.json
          node mobot-geometry-gate.cjs > /tmp/v22-geometry-gate.json
          node scripts/mobot-v22-tread-footprint.cjs > /tmp/v22/track-footprint.json
          node scripts/mobot-v22-track-rendered.mjs > /tmp/v22/track-rendered.json
          node scripts/mobot-v22-evidence-contract.cjs > /tmp/v22/evidence-contract.json
          node -e "const x=require('./scripts/mobot-v22-tread-footprint.cjs'); if(!x.continuousFootprint || x.continuousFootprint.maxBelowDatumScene<=x.maxBelowDatumScene)process.exit(1)"
          node -e "const r=require('./scripts/mobot-v22-uncertainty.cjs'); if(!r.independentSnowSide||r.perPair.length!==20)process.exit(1)"
      - name: Reproduce geometry and source measurements
        run: |
          for test in contact-sweep hood-project jaw-profile breaker-photo jaw-opening jaw-linkage boom-pose boom-cheek mount-axes bucket-cheek bucket-pose bucket-heel loader-witnesses; do node "$SUITE/$test.mjs"; done
          python3 "$SUITE/boom-pick-sensitivity.py"
          git diff --exit-code -- "$SUITE/*.json"
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify three viewports, archive, diagnostics and static mode
        run: |
          python3 -m http.server 4187 --bind 127.0.0.1 > /tmp/v22-http.log 2>&1 &
          MOBOT_REPORT_DIR=/tmp/v22/local node "$SUITE/browser.cjs"
      - name: Check deployed version and exercise Pages
        if: github.ref == 'refs/heads/main'
        run: |
          base=https://step3dlab.github.io/vr_anapa/
          for file in mobot-latest.html mobot-engineering-v22.html mobot-engineering-v22-model.js mobot-engineering-v22-passport.json research/mobot/1987/2026-11-23-track-continuous.md research/mobot/1987/2026-11-23-mrk46m-attribution.md research/mobot/1987/2026-11-24-extra-photo-evidence.md research/mobot/1987/2026-11-24-track-threejs.md research/mobot/1987/2026-11-24-track-threejs-qa.json scripts/mobot-v22-evidence-contract.cjs "$SUITE/viewer.js" "$SUITE/contact.js"; do
            for attempt in {1..30}; do
              if curl -fsSL "$base$file?sha=$GITHUB_SHA" -o /tmp/v22-bytes && cmp -s "$file" /tmp/v22-bytes; then break; fi
              sleep 5
            done
            cmp "$file" /tmp/v22-bytes
          done
          MOBOT_PUBLIC_ROUTE=1 MOBOT_REPORT_DIR=/tmp/v22/pages MOBOT_BASE_URL="$base" node "$SUITE/browser.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v22-browser-acceptance
          path: /tmp/v22
          retention-days: 30
