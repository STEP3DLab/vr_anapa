name: 1987 v21 engineering viewer QA
on:
  push:
    branches: [codex/mobot-1987-v21-20261118, codex/mobot-1987-v21-release-20261118, main]
    paths:
      - 'mobot-engineering-v21*'
      - 'mobot-latest.html'
      - 'scripts/mobot-scene-qa.mjs'
      - 'research/mobot/1987/viewer.*'
      - 'research/mobot/1987/browser.cjs'
      - '.github/workflows/mobot-1987-v21-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify geometry
        run: |
          for suite in tracks boom tools loader equipment scene; do node "research/mobot/1987/$suite.mjs"; done
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise three viewports, fallback and v20
        run: |
          python3 -m http.server 4187 --bind 127.0.0.1 >/tmp/mobot21-http.log 2>&1 &
          MOBOT_REPORT_DIR=/tmp/mobot21/local node research/mobot/1987/browser.cjs
      - name: Verify existing comparison and incoming latest links before promotion
        if: github.ref == 'refs/heads/codex/mobot-1987-v21-release-20261118'
        run: |
          node mobot-geometry-gate.cjs
          node scripts/mobot-compare-contract.cjs
          node scripts/mobot-scene-qa.mjs
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mobot21-integration.log 2>&1 &
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          node scripts/mobot-browser-qa.cjs
          node scripts/mobot-compare-qa.cjs
      - name: Verify deployed viewer and repeat on GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          base=https://step3dlab.github.io/vr_anapa/
          for f in mobot-engineering-v21.html mobot-engineering-v21-model.js research/mobot/1987/viewer.js research/mobot/1987/viewer.css; do
            found=false
            for attempt in {1..24}; do
              if curl -fsSL "$base$f?v=$GITHUB_SHA" -o /tmp/mobot21-remote && cmp -s "$f" /tmp/mobot21-remote; then found=true; break; fi
              sleep 5
            done
            "$found" || exit 1
          done
          MOBOT_BASE_URL="$base" MOBOT_REPORT_DIR=/tmp/mobot21/pages node research/mobot/1987/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobot-1987-v21-webgl
          path: /tmp/mobot21
          retention-days: 30
