name: Technopark VR CI

on:
  push:
    branches: [main]
    paths:
      - "technopark-vr/src/**"
      - "technopark-vr/tests/**"
      - "technopark-vr/package.json"
      - "technopark-vr/package-lock.json"
      - "technopark-vr/build.mjs"
      - "technopark-vr/game.css"
      - "technopark-vr/index.html"
      - ".github/workflows/technopark-vr-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technopark-vr-ci
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: technopark-vr
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: technopark-vr/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.56.1-chromium
      - name: Install Chromium for WebGL2 audit
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install-deps chromium
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
          fi
      - name: Run real WebGL2 browser audit
        env:
          PLAYWRIGHT_PATH: playwright
        run: npm run test:browser
      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technopark-vr-browser-audit-${{ github.run_number }}
          path: technopark-vr/.test-output
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Publish rebuilt browser bundle
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- technopark-vr/app.js; then
            echo "Browser bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technopark-vr/app.js
          git commit -m "Build Technopark VR browser bundle"
          git pull --rebase origin main
          git push
