name: Technopark VR CI

on:
  push:
    branches: [main]
    paths:
      - "technopark-vr/src/**"
      - "technopark-vr/tests/**"
      - "technopark-vr/package.json"
      - "technopark-vr/package-lock.json"
      - "technopark-vr/build.mjs"
      - ".github/workflows/technopark-vr-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technopark-vr-ci
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: technopark-vr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: technopark-vr/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish rebuilt browser bundle
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- technopark-vr/app.js; then
            echo "Browser bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technopark-vr/app.js
          git commit -m "Build Technopark VR browser bundle"
          git push
