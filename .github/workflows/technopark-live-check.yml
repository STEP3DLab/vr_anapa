name: Verify published Technopark VR v9
on:
  push:
    branches: [technopark-v9-live-check]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLISHED_COMMIT: d42b476a7cb390850c02e985f9c5c2d8991c8828
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm production scope
        run: |
          test -z "$(git diff --name-only 93651f6eca07a87f621cb46671bfc79d3b9a1bf1 $PUBLISHED_COMMIT | grep -v '^technopark-vr/' || true)"
          git diff --stat 93651f6eca07a87f621cb46671bfc79d3b9a1bf1 $PUBLISHED_COMMIT
      - run: npm install --prefix /tmp/vr-browser --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: /tmp/vr-browser/node_modules/.bin/playwright install chromium --with-deps
      - name: Verify HTTPS, asset hashes and public 3D scenes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFile,mkdir,writeFile} from 'node:fs/promises';
          const base='https://step3dlab.github.io/vr_anapa/';
          const sha=data=>createHash('sha256').update(data).digest('hex');
          const files=['index.html','technopark-vr/index.html','technopark-vr/app.js','technopark-vr/game.css','technopark-vr/app.css','technopark-vr/favicon.svg'];
          await mkdir('.verify',{recursive:true});
          const report={commit:process.env.PUBLISHED_COMMIT,assets:[],browser:{}};
          for(const file of files){
           const expected=sha(await readFile(file));let actual,status;
           for(let attempt=0;attempt<18;attempt++){
            const response=await fetch(base+file+'?v=9&check='+attempt,{signal:AbortSignal.timeout(20000)});status=response.status;actual=sha(Buffer.from(await response.arrayBuffer()));
            if(status===200&&actual===expected)break;await new Promise(r=>setTimeout(r,10000));
           }
           assert.equal(status,200,file+' HTTP status');assert.equal(actual,expected,file+' must match the verified published commit');
           report.assets.push({file,status,sha256:actual,match:true});
          }
          assert.match(await readFile('technopark-vr/index.html','utf8'),/app\.js\?v=9/);
          const {chromium}=await import('/tmp/vr-browser/node_modules/playwright/index.mjs');
          const browser=await chromium.launch({headless:true,args:['--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox']});
          try{
           const page=await browser.newPage({viewport:{width:1440,height:900}}),errors=[];
           page.on('pageerror',e=>errors.push(String(e)));page.on('console',m=>{if(m.type()==='error')errors.push(m.text());});
           const response=await page.goto(base+'technopark-vr/?v=9',{waitUntil:'networkidle'});assert.equal(response.status(),200);
           await page.waitForFunction(()=>document.querySelector('.live-badge')?.textContent.includes('9'));await page.waitForTimeout(1100);
           assert.equal(await page.locator('.game-error').count(),0);await page.screenshot({path:'.verify/live-hub.png'});
           report.browser={url:page.url(),status:response.status(),version:await page.locator('.live-badge').innerText(),scenes:[],softwareGPU:true};
           for(const [name,text] of [['cargo','Полигон Лосинка'],['robot','Робот-арена'],['drones','Дрон-тир']]){
            await page.locator('.portal-cards button').filter({hasText:text}).click();await page.waitForTimeout(600);
            assert.equal(await page.locator('.game-error').count(),0);report.browser.scenes.push({name,status:await page.locator('.game-status').innerText()});
            await page.screenshot({path:'.verify/live-'+name+'.png'});await page.getByRole('button',{name:'⌂ Холл',exact:true}).click();
           }
           assert.deepEqual(errors,[]);report.browser.errors=errors;
           await writeFile('.verify/live-report.json',JSON.stringify(report,null,2));
           console.log('PASS: published v9 loads over HTTPS, all 3 scenes render, browser errors [], all 6 assets including unchanged root index exactly match the published commit. Software GPU, not a headset test.');
           console.log(JSON.stringify(report,null,2));
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-v9-verification
          path: .verify
          include-hidden-files: true
          retention-days: 3
