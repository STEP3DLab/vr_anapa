name: Mobot laboratory checks
on:
  push:
    paths:
      - 'mobot-lab/**'
      - '.github/workflows/mobot-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobot-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  laboratory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check archive registration, moving assemblies and XR interactions
        run: node --test mobot-lab/tests/lab.test.mjs
      - name: Prepare the browser test driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Exercise desktop, mobile and offline exhibition
        env:
          MOBOT_CHROME_CHANNEL: chrome
        run: |
          python3 -m http.server 4200 --bind 127.0.0.1 > /tmp/mobot-lab-http.log 2>&1 &
          for i in {1..15}; do
            if curl --silent --fail http://127.0.0.1:4200/mobot-lab/ > /dev/null; then break; fi
            sleep 1
          done
          node mobot-lab/tests/browser.cjs
