name: Mobot research WebGL QA
on:
  push:
    branches: [main, codex/mobot-demo-20261118]
    paths:
      - 'mobot-demo.html'
      - 'mobot-compare.html'
      - 'mobot-assets/compare-v1.*'
      - 'mobot-geometry-gate.cjs'
      - 'mobot-latest.html'
      - 'mobot-roof.html'
      - 'mobot-demo-release-2026-11-18.json'
      - 'mobot-demo-script-2026-11-18.md'
      - 'mobot-geometry-changes-2026-11-18.md'
      - 'mobot-ch-hv-1986-research-v5*'
      - 'mobot-engineering-v20*'
      - 'mobot-assets/exhibition-v1.*'
      - 'scripts/mobot-browser-qa.cjs'
      - 'scripts/mobot-compare-qa.cjs'
      - 'scripts/mobot-compare-contract.cjs'
      - 'scripts/mobot-pages-wait.cjs'
      - 'scripts/mobot-scene-qa.mjs'
      - 'mobot-assets/exhibition-v1.css'
      - 'mobot-photo-measure-v2.html'
      - 'mobot-assets/photo-measure-v2.js'
      - '.github/workflows/mobot-research-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install real browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Syntax and research-version gates
        run: |
          node --check mobot-ch-hv-1986-research-v5-model.js
          node --check mobot-engineering-v20-model.js
          node --check mobot-assets/exhibition-v1.js
          node --check mobot-assets/compare-v1.js
          node --check scripts/mobot-compare-qa.cjs
          node scripts/mobot-compare-contract.cjs
          node --check scripts/mobot-pages-wait.cjs
          node --check scripts/mobot-browser-qa.cjs
          node mobot-geometry-gate.cjs
          node --check mobot-assets/photo-measure-v2.js
          node scripts/mobot-scene-qa.mjs
      - name: Real desktop and mobile WebGL2
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mobot-http.log 2>&1 &
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          node scripts/mobot-browser-qa.cjs
          node scripts/mobot-compare-qa.cjs
      - name: Verify published Pages bytes and real production WebGL2
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/mobot-pages-wait.cjs
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          export MOBOT_BASE_URL="https://step3dlab.github.io/vr_anapa/"
          node scripts/mobot-browser-qa.cjs
          node scripts/mobot-compare-qa.cjs
      - name: Archive actual screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobot-real-browser-qa
          path: mobot-qa/demo-2026-11-18/
          retention-days: 30
      - name: Server log on failure
        if: failure()
        run: cat /tmp/mobot-http.log || true
