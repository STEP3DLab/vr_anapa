name: Technopark VR audit
on:
  push:
    branches: [technopark-v9-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technopark-vr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node tests/game.test.mjs && node tests/engine.test.mjs
      - run: npm run build
      - name: Package audit dependencies and build
        if: always()
        run: tar -czf /tmp/technopark-toolchain.tar.gz node_modules package-lock.json app.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technopark-audit-toolchain
          path: /tmp/technopark-toolchain.tar.gz
          retention-days: 1
